name: Deploy Widget to CDN

on:
  push:
    branches: [master, main]
    paths:
      - "packages/widget/src/**"
      - "packages/widget/public/**"
      - "packages/widget/scripts/**"
      - "packages/widget/vite.config.ts"
      - "packages/widget/package.json"
      - "apps/landing/public/logo-dark.png"
      - "apps/landing/public/logo-icon.png"
      - ".github/workflows/deploy-widget.yml"

jobs:
  deploy:
    name: Build & Upload to Cloudflare R2
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm --filter @inculva/widget build:cdn

      # ── widget.js ────────────────────────────────────────────────────────────
      # Short TTL (5 min) so updates propagate quickly after each deploy.
      - name: Upload widget.js to R2
        run: |
          aws s3 cp packages/widget/dist/widget.iife.js \
            s3://${{ env.R2_BUCKET }}/widget.js \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=300, stale-while-revalidate=60"

      - name: Upload source map to R2
        run: |
          aws s3 cp packages/widget/dist/widget.iife.js.map \
            s3://${{ env.R2_BUCKET }}/widget.iife.js.map \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --content-type "application/json" \
            --cache-control "public, max-age=300"

      # ── fonts/ ───────────────────────────────────────────────────────────────
      # Fonts are content-addressed by filename and never mutate, so they use an
      # immutable TTL.  CORS headers allow any embedded site to load them.
      - name: Upload WOFF2 fonts to R2 (cdn.inculva.com/fonts/*)
        run: |
          for f in packages/widget/public/fonts/*.woff2; do
            aws s3 cp "$f" \
              s3://${{ env.R2_BUCKET }}/fonts/$(basename "$f") \
              --endpoint-url ${{ env.R2_ENDPOINT }} \
              --content-type "font/woff2" \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "Access-Control-Allow-Origin=*"
          done

      - name: Upload OTF fonts to R2 (cdn.inculva.com/fonts/*)
        run: |
          for f in packages/widget/public/fonts/*.otf; do
            aws s3 cp "$f" \
              s3://${{ env.R2_BUCKET }}/fonts/$(basename "$f") \
              --endpoint-url ${{ env.R2_ENDPOINT }} \
              --content-type "font/otf" \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "Access-Control-Allow-Origin=*"
          done

      # ── i18n/ ────────────────────────────────────────────────────────────────
      # Translation JSON files — 1 day TTL, CORS open so any embedded site can load.
      - name: Upload i18n JSON files to R2 (cdn.inculva.com/i18n/*)
        run: |
          for f in packages/widget/public/i18n/*.json; do
            aws s3 cp "$f" \
              s3://${{ env.R2_BUCKET }}/i18n/$(basename "$f") \
              --endpoint-url ${{ env.R2_ENDPOINT }} \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=86400, stale-while-revalidate=3600" \
              --metadata "Access-Control-Allow-Origin=*"
          done

      # ── logos ─────────────────────────────────────────────────────────────────
      # Brand logos — widget loads these from CDN instead of embedding as base64.
      - name: Upload logo images to R2 (cdn.inculva.com/logo-*.png)
        run: |
          aws s3 cp apps/landing/public/logo-dark.png \
            s3://${{ env.R2_BUCKET }}/logo-dark.png \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/landing/public/logo-icon.png \
            s3://${{ env.R2_BUCKET }}/logo-icon.png \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
